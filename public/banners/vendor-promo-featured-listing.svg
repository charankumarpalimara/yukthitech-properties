<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 220" width="1920" height="220" role="img" aria-label="Sponsored property listing">
  <defs>
    <linearGradient id="listing-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="220" fill="url(#listing-bg)"/>

  <!-- Left icon -->
  <rect x="48" y="62" width="100" height="96" rx="10" fill="#f8fafc" fill-opacity="0.1" stroke="#c5a880" stroke-width="2"/>
  <polygon fill="#c5a880" points="88,142 68,142 68,118 78,104 88,118"/>
  <rect x="74" y="124" width="12" height="18" fill="#c5a880"/>

  <!-- Tag (own row, no overlap) -->
  <rect x="172" y="58" width="188" height="26" rx="13" fill="#c5a880"/>
  <text x="188" y="76" fill="#0f172a" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">SPONSORED</text>

  <!-- Content block below tag -->
  <text x="172" y="108" fill="#f8fafc" font-family="Arial,sans-serif" font-size="32" font-weight="700">3 BHK Apartment</text>
  <text x="172" y="138" fill="#f5ecd8" font-family="Arial,sans-serif" font-size="20" font-weight="600">Banjara Hills, Hyderabad</text>
  <text x="172" y="164" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="15" font-weight="500">Prime Realtors - RERA Verified</text>

  <!-- Price card (right) -->
  <rect x="1540" y="62" width="332" height="96" rx="12" fill="#ffffff" fill-opacity="0.96"/>
  <text x="1564" y="100" fill="#0f172a" font-family="Arial,sans-serif" font-size="30" font-weight="800">Rs. 1.2 Cr</text>
  <text x="1564" y="128" fill="#9c7f56" font-family="Arial,sans-serif" font-size="14" font-weight="700">Ready to Move</text>
</svg>
