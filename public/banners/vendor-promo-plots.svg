<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 220" width="1920" height="220" role="img" aria-label="Featured vendor plots">
  <defs>
    <linearGradient id="plots-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="220" fill="url(#plots-bg)"/>

  <!-- Left icon -->
  <rect x="48" y="62" width="100" height="96" rx="10" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/>
  <rect x="68" y="118" width="60" height="32" fill="#059669" fill-opacity="0.35"/>
  <text x="82" y="110" fill="#047857" font-family="Arial,sans-serif" font-size="11" font-weight="800">PLOT</text>

  <!-- Tag row -->
  <rect x="172" y="58" width="200" height="26" rx="13" fill="#059669"/>
  <text x="188" y="76" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">FEATURED VENDOR</text>

  <!-- Content -->
  <text x="172" y="108" fill="#0f172a" font-family="Arial,sans-serif" font-size="32" font-weight="700">HMDA Approved Plots</text>
  <text x="172" y="138" fill="#047857" font-family="Arial,sans-serif" font-size="20" font-weight="600">Shankarpally - 200 Sq. Yards</text>
  <text x="172" y="164" fill="#64748b" font-family="Arial,sans-serif" font-size="15" font-weight="500">Green Valley Developers</text>

  <!-- Price card -->
  <rect x="1540" y="62" width="332" height="96" rx="12" fill="#0f172a"/>
  <text x="1564" y="100" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="800">From Rs. 25 L</text>
  <text x="1564" y="128" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="14" font-weight="700">Limited Units</text>
